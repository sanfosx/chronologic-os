services:
  postgres:
    image: postgres:16-alpine
    container_name: chronologic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chronologic
      POSTGRES_PASSWORD: chronologic
      POSTGRES_DB: chronologic_os
    ports:
      - "5432:5432"
    volumes:
      - chronologic_pgdata:/var/lib/postgresql/data

volumes:
  chronologic_pgdata:
